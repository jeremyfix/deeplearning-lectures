data:
  batch_size: 40960
  normalize: True
  valid_ratio: 0.2
  num_workers: 4
  class: "ImageDataset"
  params:
    root_dir: './images'

optim:
  algo: AdamW
  params:
    lr: 0.01
    weight_decay: 0.001

nepochs: 200

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster
  imgfreq: 10

# model:
#   class: "RealNGP"
#   params:
#     n_hidden_units: 64
#     n_hidden_layers: 2
#     pos_encoding:
#       class: "Hash"
#       params: 
#         otype: "HashGrid"
#         n_levels: 16
#         n_features_per_level: 2
#         log2_hashmap_size: 15
#         base_resolution: 16
#         per_level_scale: 1.5
#         fixed_point_pos: False
model:
  class: "FullTinyCudaNGP"
  params:
    pos_encoding:
      class: "Hash"
      params: 
        otype: "HashGrid"
        n_levels: 16
        n_features_per_level: 2
        log2_hashmap_size: 15
        base_resolution: 16
        per_level_scale: 1.5
        fixed_point_pos: False
    network:
      otype: "FullyFusedMLP"
      activation: "ReLU"
      output_activation: "None"
      n_neurons: 64
      n_hidden_layers: 2
