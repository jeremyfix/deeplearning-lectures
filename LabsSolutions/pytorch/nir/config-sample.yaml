data:
  batch_size: 2048
  normalize: True
  valid_ratio: 0.2
  num_workers: 4
  class: "ImageDataset"
  params:
    root_dir: './images'

optim:
  algo: AdamW
  params:
    lr: 0.01
    weight_decay: 0.000001

nepochs: 200

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster

model:
  class: "RealNGP"
  params:
    n_hidden_units: 256
    n_hidden_layers: 10
    pos_encoding:
      class: "Positional"
      params: 
        L: 10
