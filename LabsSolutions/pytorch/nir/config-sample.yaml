data:
  batch_size: 32
  normalize: True
  valid_ratio: 0.2
  num_workers: 4
  class: "MICCAI"
  params:
    root_dir: '/mounts/datasets/datasets/MICCAIChallenge2023/MultiCoil/cine/TrainingSet/P001'

optim:
  algo: Adam
  params:
    lr: 0.001

nepochs: 20

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster

model:
  class: "RealNGP"
  params:
    n_hidden_units: 32
    n_hidden_layers: 4
    pos_encoding:
      class: "Positional"
      params: 
        L: 10
