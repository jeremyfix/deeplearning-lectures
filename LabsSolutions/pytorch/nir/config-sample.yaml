data:
  root_dir: '/mounts/datasets/datasets/MICCAIChallenge2023/MultiCoil/cine/TrainingSet/P001'
  normalize: True

optim:
  algo: Adam
  params:
    lr: 0.001

nepochs: 20

logging:
  # wandb: 
  #   project: sample_project
  #   entity: sample_entity
  logdir: "./logs"  # Better to provide the fullpath, especially on the cluster

model:
  class: "RealNGP"
  params:
    n_hidden_units: 32
    n_hidden_layers: 4
    pos_encoding:
      class: "Positional"
      params: 
        L: 10
