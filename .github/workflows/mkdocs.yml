name: Mkdocs website construction and deployment

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Get the source code
        uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Python venv setup
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache id var
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 

      - name: Cache the venv
        uses: actions/cache@v4
        with:
          key: mkdocs-deeplearning-${{ env.cache_id }}
          path: .cache 
          restore-keys: |
            mkdocs-deeplearning-

      - name: Install the required dependencies
        run: pip install mkdocs-material mkdocs-awesome-nav

      - name: Build and deploy website
        working-directory: ./website/conf
        run: mkdocs gh-deploy --force
