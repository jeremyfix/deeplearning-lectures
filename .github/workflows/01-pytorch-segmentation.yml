name: Pytorch semantic segmentation lab test

on:
  push:
    paths:
      - 'LabsSolutions/pytorch/segmentation/**'

jobs:

  test-pytorch-segmentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   
          cache: 'pip' # Cache the installed dependencies

      - name: Install the dependencies
        run: python -m pip install ./LabsSolutions/pytorch/segmentation

      - name: Test implementation
        run: python -m semseg.models
