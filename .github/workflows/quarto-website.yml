name: Quarto website build and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master


jobs:

  templatecode:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true 
          cache-dependency-glob: ".github/workflows/requirements.txt"

      - name: Install requirements
        run: uv pip install -r .github/workflows/requirements.txt
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Template code generation and solution code copy
        run: easylabwork LabsSolutions StudentsCode

      - name: Pytorch Semseg base code
        run: |
          mkdir -p assets 
          cd StudentsCode/pytorch/ 
          tar -zcvf ../../assets/semseg-kit.tar.gz segmentation

      - name: Pytorch Semseg solution code
        run: |
          mkdir -p assets 
          cd LabsSolutions/pytorch/ 
          tar -zcvf ../../assets/semseg-sol.tar.gz segmentation

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [templatecode]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download the template code
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: Webpage

      - name: Check for LaTeX changes
        id: latex-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^Webpage/latex/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache LaTeX diagrams
        id: cache-latex
        uses: actions/cache@v4
        with:
          path: Webpage/pytorch/segmentation/unet.png
          key: latex-diagrams-${{ hashFiles('Webpage/latex/**') }}
          restore-keys: |
            latex-diagrams-

      - name: Install LaTeX dependencies
        if: steps.latex-check.outputs.changed == 'true' || steps.cache-latex.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-pictures poppler-utils

      - name: Build LaTeX diagrams
        if: steps.latex-check.outputs.changed == 'true' || steps.cache-latex.outputs.cache-hit != 'true'
        run: |
          cd Webpage
          bash build-latex.sh

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          path: Webpage
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
