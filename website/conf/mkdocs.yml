site_name: An introduction to deep learning
docs_dir: ../md
repo_url: https://github.com/jeremyfix/deeplearning-lectures
site_url: https://jeremyfix.github.io/deeplearning-lectures
theme: 
  name: material
  language: fr
  features:
    - navigation.sections
    - toc.follow
    - toc.integrate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.critic
  - pymdownx.arithmatex:
      generic: true  
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - footnotes

extra_javascript:
  - https://code.jquery.com/jquery-3.7.1.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
    - search

copyright: >
   <p xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/"><a property="dct:title" rel="cc:attributionURL" href="https://jeremyfix.github.io/deeplearning-lectures/">An introduction to deep learning</a> by <a rel="cc:attributionURL dct:creator" property="cc:attributionName" href="https://jeremyfix.github.io">Jeremy Fix</a> is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1" target="_blank" rel="license noopener noreferrer" style="display:inline-block;">CC BY-SA 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1" alt=""></a></p> 


nav:
  - Index: index.md
  - Keras lab: 
    - keras/00-keras-mnist.md

